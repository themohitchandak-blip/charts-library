<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charts Library — Premium Stock Research &amp; Market Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#080C16;
  --navy-900:#0D1424;
  --navy-850:#111A2E;
  --navy-800:#16203A;
  --navy-700:#202C48;
  --navy-600:#2C3A5C;
  --hairline:rgba(255,255,255,0.08);
  --ink-050:#F6F7FB;
  --ink-100:#E9ECF4;
  --ink-300:#B7BFD4;
  --ink-500:#8890A6;
  --gold-300:#E7CD8E;
  --gold-400:#C9A24B;
  --gold-500:#AD8836;
  --blue-400:#6E93EE;
  --blue-500:#4C74D9;
  --green-500:#3B9E70;
  --green-bg:rgba(59,158,112,0.14);
  --amber-500:#D6A32B;
  --amber-bg:rgba(214,163,43,0.14);
  --red-500:#D6685D;
  --red-bg:rgba(214,104,93,0.14);
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --maxw:1120px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--navy-950);
  color:var(--ink-100);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
::selection{background:var(--gold-400);color:var(--navy-950);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
.serif{font-family:var(--serif);}
.muted{color:var(--ink-300);}
.dim{color:var(--ink-500);}

/* ---------- top nav ---------- */
.topnav{
  position:sticky;top:0;z-index:40;
  background:rgba(8,12,22,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline);
}
.topnav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
.brandmark{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brandmark .mark{width:26px;height:26px;flex:0 0 auto;}
.brandmark .name{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:0.2px;color:var(--ink-050);}
.navlinks{display:flex;align-items:center;gap:28px;}
.navlinks a{font-size:14px;color:var(--ink-300);cursor:pointer;}
.navlinks a:hover{color:var(--ink-050);}
.navcta{display:flex;gap:10px;align-items:center;}
@media (max-width:760px){ .navlinks{display:none;} }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:var(--radius-s);border:1px solid transparent;
  font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.98);}
.btn-gold{background:linear-gradient(180deg,var(--gold-300),var(--gold-500));color:#1B1404;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;border-color:var(--navy-600);color:var(--ink-100);}
.btn-outline:hover{border-color:var(--gold-400);color:var(--gold-300);}
.btn-ghost{background:transparent;color:var(--ink-300);padding:10px 14px;}
.btn-ghost:hover{color:var(--ink-050);}
.btn-danger{background:transparent;border-color:var(--red-500);color:var(--red-500);}
.btn-danger:hover{background:var(--red-bg);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

/* ---------- hero ---------- */
.hero{position:relative;padding:96px 0 84px;overflow:hidden;border-bottom:1px solid var(--hairline);}
.hero-bg{position:absolute;inset:0;pointer-events:none;opacity:0.5;}
.hero-inner{position:relative;max-width:700px;}
.eyebrow{font-size:13px;color:var(--gold-300);letter-spacing:0.02em;margin-bottom:18px;}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,6vw,60px);line-height:1.08;margin:0 0 20px;color:var(--ink-050);}
.hero h1 em{font-style:italic;color:var(--gold-300);}
.hero p.lead{font-size:17px;color:var(--ink-300);max-width:520px;margin:0 0 34px;}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap;}
.hero .ctas .btn{padding:14px 26px;}

/* ---------- sections ---------- */
section.block{padding:80px 0;border-bottom:1px solid var(--hairline);}
section.block.tight{padding:64px 0;}
.section-head{max-width:600px;margin:0 0 40px;}
.section-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,34px);margin:0 0 12px;color:var(--ink-050);}
.section-head p{color:var(--ink-300);font-size:15.5px;margin:0;}

/* member benefit cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid4{grid-template-columns:1fr;}}
.benefit-card{border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-m);padding:26px 22px;transition:border-color .2s;}
.benefit-card:hover{border-color:var(--navy-600);}
.benefit-card .bicon{width:34px;height:34px;margin-bottom:16px;color:var(--gold-400);}
.benefit-card h3{font-size:15px;margin:0 0 8px;color:var(--ink-050);letter-spacing:0.01em;}
.benefit-card p{font-size:13.5px;color:var(--ink-500);margin:0;}

/* mission timeline */
.mission{background:var(--navy-900);border-radius:var(--radius-l);padding:52px 44px;border:1px solid var(--hairline);}
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
@media (max-width:820px){.mission-grid{grid-template-columns:1fr;}}
.mission blockquote{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.55;color:var(--ink-100);margin:0 0 22px;}
.mission .pillar-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
.pill{border:1px solid var(--navy-600);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ink-300);}
.timeline-svg{width:100%;height:auto;}
.illus-note{text-align:center;font-size:12px;color:var(--ink-500);margin-top:14px;}

/* approach row */
.approach-row{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--hairline);border-radius:var(--radius-m);overflow:hidden;}
.approach-item{flex:1 1 160px;padding:22px 20px;border-right:1px solid var(--hairline);text-align:left;}
.approach-item:last-child{border-right:none;}
.approach-item .num{font-family:var(--serif);font-size:13px;color:var(--gold-400);margin-bottom:8px;}
.approach-item .label{font-size:14px;color:var(--ink-100);font-weight:600;}
@media (max-width:760px){.approach-item{flex:1 1 50%;border-bottom:1px solid var(--hairline);}}

/* pricing */
.grid4plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:960px){.grid4plans{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid4plans{grid-template-columns:1fr;}}
.plan-card{position:relative;border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-m);padding:28px 22px;display:flex;flex-direction:column;transition:transform .18s ease, border-color .18s ease;}
.plan-card:hover{transform:translateY(-3px);border-color:var(--navy-600);}
.plan-card.featured{border-color:var(--gold-500);background:linear-gradient(180deg,var(--navy-850),var(--navy-900));}
.plan-badge{position:absolute;top:-11px;left:22px;font-size:11px;letter-spacing:0.03em;padding:4px 10px;border-radius:999px;font-weight:600;}
.plan-badge.best{background:var(--gold-400);color:#1B1404;}
.plan-badge.pop{background:var(--blue-500);color:#fff;}
.plan-name{font-size:13.5px;color:var(--ink-300);margin:8px 0 14px;}
.plan-price{font-family:var(--serif);font-size:34px;color:var(--ink-050);margin:0 0 4px;}
.plan-price sup{font-size:16px;font-weight:500;top:-14px;position:relative;margin-right:2px;}
.plan-save{font-size:12.5px;color:var(--green-500);margin-bottom:20px;min-height:16px;}
.plan-card .btn{margin-top:auto;}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,1fr);}}
.step{border:1px solid var(--hairline);border-radius:var(--radius-m);padding:20px 16px;background:var(--navy-900);}
.step .n{font-family:var(--serif);font-size:20px;color:var(--gold-400);margin-bottom:10px;}
.step p{font-size:13px;color:var(--ink-300);margin:0;}

/* disclaimer */
.disclaimer-box{border:1px solid var(--hairline);border-left:3px solid var(--amber-500);background:var(--navy-900);border-radius:var(--radius-m);padding:22px 24px;font-size:13.5px;color:var(--ink-300);}
.disclaimer-box strong{color:var(--ink-100);}

/* faq */
.faq-item{border-bottom:1px solid var(--hairline);padding:18px 0;cursor:pointer;}
.faq-q{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-050);font-weight:500;}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13.5px;color:var(--ink-300);}
.faq-item.open .faq-a{max-height:220px;padding-top:12px;}
.faq-item .chev{transition:transform .2s;color:var(--ink-500);}
.faq-item.open .chev{transform:rotate(45deg);}

/* final cta */
.finalcta{text-align:center;padding:90px 0;background:radial-gradient(ellipse at 50% 0%, rgba(201,162,75,0.09), transparent 60%);}
.finalcta h2{font-family:var(--serif);font-size:clamp(28px,4vw,40px);margin:0 0 16px;color:var(--ink-050);}
.finalcta p{color:var(--ink-300);margin:0 0 30px;}

/* footer */
footer{padding:44px 0;}
.footer-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--ink-500);}
.footer-links{display:flex;gap:20px;flex-wrap:wrap;}
.footer-links a{cursor:pointer;color:var(--ink-500);}
.footer-links a:hover{color:var(--ink-100);}

/* ---------- generic form page ---------- */
.formpage{padding:56px 0 90px;min-height:70vh;}
.formcol{max-width:520px;margin:0 auto;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-500);cursor:pointer;margin-bottom:28px;}
.back-link:hover{color:var(--ink-100);}
.form-card{border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-l);padding:36px 32px;}
.form-card h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;color:var(--ink-050);}
.form-card .sub{font-size:13.5px;color:var(--ink-500);margin:0 0 28px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:var(--ink-300);margin-bottom:7px;}
.field input, .field select, .field textarea{
  width:100%;background:var(--navy-850);border:1px solid var(--navy-600);color:var(--ink-050);
  border-radius:var(--radius-s);padding:12px 14px;font-size:14.5px;font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold-400);}
.field .err{font-size:12px;color:var(--red-500);margin-top:6px;display:none;}
.field.invalid input, .field.invalid select{border-color:var(--red-500);}
.field.invalid .err{display:block;}
.field .hint{font-size:12px;color:var(--ink-500);margin-top:6px;}
.upload-box{border:1.5px dashed var(--navy-600);border-radius:var(--radius-m);padding:22px;text-align:center;cursor:pointer;transition:border-color .2s;}
.upload-box:hover{border-color:var(--gold-400);}
.upload-box.has-file{border-style:solid;border-color:var(--green-500);}
.upload-preview{max-height:180px;border-radius:var(--radius-s);margin-top:12px;overflow:hidden;}
.upload-preview img{width:100%;object-fit:contain;max-height:180px;background:var(--navy-950);}

/* summary row inside payment page */
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;}
.summary-row.total{border-top:1px solid var(--hairline);margin-top:6px;padding-top:16px;font-size:16px;color:var(--ink-050);font-weight:600;}
.qr-box{background:#fff;border-radius:var(--radius-m);padding:18px;display:flex;justify-content:center;margin:18px 0;}
.upi-id-row{display:flex;align-items:center;justify-content:space-between;background:var(--navy-850);border:1px solid var(--navy-600);border-radius:var(--radius-s);padding:12px 16px;margin-bottom:18px;}
.upi-id-row code{font-size:14px;color:var(--gold-300);}
.copy-btn{font-size:12px;color:var(--blue-400);cursor:pointer;}
.instr-list{margin:0;padding-left:18px;color:var(--ink-300);font-size:13.5px;line-height:1.9;}

/* status badges */
.status-badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;}
.status-badge .dot{width:7px;height:7px;border-radius:50%;}
.status-badge.pending{background:var(--amber-bg);color:var(--amber-500);}
.status-badge.pending .dot{background:var(--amber-500);}
.status-badge.active{background:var(--green-bg);color:var(--green-500);}
.status-badge.active .dot{background:var(--green-500);}
.status-badge.rejected{background:var(--red-bg);color:var(--red-500);}
.status-badge.rejected .dot{background:var(--red-500);}
.status-badge.expired{background:rgba(136,144,166,0.16);color:var(--ink-500);}
.status-badge.expired .dot{background:var(--ink-500);}
.status-badge.cancelled{background:rgba(136,144,166,0.16);color:var(--ink-500);}
.status-badge.cancelled .dot{background:var(--ink-500);}

.status-page{max-width:560px;margin:0 auto;text-align:center;padding:40px 0;}
.status-icon{width:56px;height:56px;margin:0 auto 22px;}
.status-page h1{font-family:var(--serif);font-size:28px;margin:0 0 10px;color:var(--ink-050);}
.status-page .sub{color:var(--ink-300);font-size:14.5px;margin-bottom:30px;}
.status-card{border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-l);padding:28px;text-align:left;margin-bottom:24px;}
.status-card .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hairline);font-size:14px;}
.status-card .row:last-child{border-bottom:none;}
.status-card .row .k{color:var(--ink-500);}
.status-card .row .v{color:var(--ink-050);font-weight:500;}
.msgbox{font-size:13.5px;color:var(--ink-300);background:var(--navy-900);border:1px solid var(--hairline);border-radius:var(--radius-m);padding:18px 20px;margin-bottom:24px;}

/* admin */
.admin-shell{display:flex;min-height:100vh;}
.admin-sidebar{width:220px;flex:0 0 220px;background:var(--navy-900);border-right:1px solid var(--hairline);padding:24px 0;position:sticky;top:0;height:100vh;}
.admin-sidebar .brand{padding:0 22px 22px;border-bottom:1px solid var(--hairline);margin-bottom:14px;}
.admin-sidebar .brand .name{font-family:var(--serif);font-size:16px;color:var(--ink-050);}
.admin-sidebar .brand .tag{font-size:11px;color:var(--ink-500);}
.admin-nav a{display:block;padding:11px 22px;font-size:13.5px;color:var(--ink-300);cursor:pointer;border-left:2px solid transparent;}
.admin-nav a:hover{color:var(--ink-050);}
.admin-nav a.active{color:var(--gold-300);border-left-color:var(--gold-400);background:rgba(201,162,75,0.06);}
.admin-nav .divider{height:1px;background:var(--hairline);margin:12px 22px;}
.admin-main{flex:1;min-width:0;padding:32px 36px 60px;}
@media (max-width:860px){.admin-shell{flex-direction:column;}.admin-sidebar{width:100%;flex:none;height:auto;position:relative;padding:14px 0;}.admin-nav{display:flex;overflow-x:auto;padding:0 10px;}.admin-nav a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent;}.admin-nav a.active{border-left:none;border-bottom-color:var(--gold-400);}.admin-nav .divider{display:none;}.admin-main{padding:24px 18px 50px;}}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.admin-topbar h1{font-family:var(--serif);font-size:24px;margin:0;color:var(--ink-050);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
@media (max-width:860px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-m);padding:20px;}
.kpi-card .label{font-size:12px;color:var(--ink-500);margin-bottom:8px;letter-spacing:0.02em;}
.kpi-card .value{font-family:var(--serif);font-size:26px;color:var(--ink-050);}
.panel{border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-m);overflow:hidden;margin-bottom:28px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hairline);flex-wrap:wrap;gap:10px;}
.panel-head h3{margin:0;font-size:15px;color:var(--ink-050);}
table.admtbl{width:100%;border-collapse:collapse;font-size:13.5px;}
table.admtbl th{text-align:left;padding:11px 16px;color:var(--ink-500);font-weight:500;font-size:12px;border-bottom:1px solid var(--hairline);white-space:nowrap;}
table.admtbl td{padding:12px 16px;border-bottom:1px solid var(--hairline);color:var(--ink-100);vertical-align:middle;white-space:nowrap;}
table.admtbl tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}
.link-btn{color:var(--blue-400);cursor:pointer;font-size:13px;}
.link-btn:hover{text-decoration:underline;}
.empty-row td{text-align:center;color:var(--ink-500);padding:40px 16px;}
.search-input{background:var(--navy-850);border:1px solid var(--navy-600);border-radius:var(--radius-s);padding:9px 13px;color:var(--ink-100);font-size:13.5px;min-width:200px;}
.chip-filters{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--navy-600);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink-300);cursor:pointer;}
.chip.active{background:var(--gold-400);color:#1B1404;border-color:var(--gold-400);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,12,0.7);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--navy-900);border:1px solid var(--navy-600);border-radius:var(--radius-l);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:30px;}
.modal h3{font-family:var(--serif);font-size:20px;margin:0 0 18px;color:var(--ink-050);}
.modal .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hairline);font-size:13.5px;}
.modal .row .k{color:var(--ink-500);}
.modal .row .v{color:var(--ink-100);text-align:right;max-width:60%;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal img.ss{width:100%;border-radius:var(--radius-s);margin:14px 0;border:1px solid var(--navy-600);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy-800);border:1px solid var(--navy-600);color:var(--ink-050);padding:13px 22px;border-radius:var(--radius-s);font-size:13.5px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s ease;pointer-events:none;}
.toast.show{opacity:1;}

.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;border:1px solid var(--hairline);background:var(--navy-900);border-radius:var(--radius-l);padding:36px 32px;text-align:center;}

.demo-banner{background:var(--navy-800);border-bottom:1px solid var(--hairline);font-size:12px;color:var(--ink-500);text-align:center;padding:8px 14px;}
.demo-banner b{color:var(--gold-300);}

.legal-body{max-width:680px;margin:0 auto;padding:70px 0 100px;}
.legal-body h1{font-family:var(--serif);font-size:30px;margin-bottom:24px;}
.legal-body p, .legal-body li{color:var(--ink-300);font-size:14.5px;line-height:1.8;}

@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.fade-in{animation:fadein .45s ease both;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   CHARTS LIBRARY — LIVE APP (Supabase-backed)
   Real Postgres database, real admin authentication, private screenshot storage.

async function genOrderId(){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + pad(d.getMonth()+1) + pad(d.getDate());
  const suffix = pad(Date.now() % 1000, 3) + Math.floor(Math.random()*9);
  return 'CL' + ymd + suffix;
}

/* ---------------- utils ---------------- */
function pad(n, len){ len=len||2; n=String(n); while(n.length<len) n='0'+n; return n; }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function inr(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addMonthsClamped(dateISO, months){
  const d = new Date(dateISO);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + months);
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d.toISOString();
}
function daysUntil(iso){
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(iso); target.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function validMobile(m){ return /^[6-9]\d{9}$/.test((m||'').replace(/\D/g,'').slice(-10)); }
function validEmail(e){ return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

async function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function copyUPI(){

  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('UPI ID copied')); }
  else toast('UPI ID: '+t);

function qrPlaceholderSVG(){
  return `<svg width="180" height="180" viewBox="0 0 180 180">
    <rect width="180" height="180" fill="#fff"/>${qrDots()}
    <rect x="70" y="70" width="40" height="40" fill="#fff" stroke="#0A0F1C" stroke-width="1.5"/>
    <text x="90" y="94" text-anchor="middle" font-size="9" fill="#0A0F1C" font-family="Inter">UPI</text>
  </svg>`;
}
function qrDots(){
  let out = '';
  let rnd = 137;
  const next = ()=>{ rnd = (rnd*9301+49297)%233280; return rnd/233280; };
  for(let y=0;y<18;y++){
    for(let x=0;x<18;x++){
      if((x<4&&y<4)||(x>13&&y<4)||(x<4&&y>13)) continue;
      if(next() > 0.52) out += `<rect x="${x*10}" y="${y*10}" width="9" height="9" fill="#0A0F1C"/>`;
    }
  }
  [[0,0],[130,0],[0,130]].forEach(([fx,fy])=>{
    out += `<rect x="${fx}" y="${fy}" width="40" height="40" fill="#0A0F1C"/>`;
    out += `<rect x="${fx+7}" y="${fy+7}" width="26" height="26" fill="#fff"/>`;
    out += `<rect x="${fx+14}" y="${fy+14}" width="12" height="12" fill="#0A0F1C"/>`;
  });
  return out;
}

        name: signup.name,
        mobile: signup.mobile,
        email: signup.email || null,
        plan_id: plan.id,
        plan_name: plan.name,
        duration_months: plan.duration_months,
        amount: plan.price,
        utr,
        payment_date: paymentDate,
        screenshot_path: screenshotPath,
        payment_status: 'PENDING',
        membership_status: 'PAYMENT_PENDING',
        whatsapp_access_status: 'NOT_GRANTED',
        notes: [],
      };
      const ok2 = await DB.createOrder(order);
      if(!ok2) throw new Error('save failed');
      window.__pendingSignup = null;
      window.__lastSubmittedOrder = order; // used to render the confirmation without a public read
      go('#/submitted/'+orderId);
    }catch(err){

        toast("We couldn't upload your screenshot. Please try again or use a different image.");
      } else {
        toast("We couldn't submit your payment details. Please try again.");
      }
      btn.disabled = false; btn.textContent = 'Submit Payment for Verification';
    }
  });
}

async function openRequestModal(orderId){
  const o = await DB.getOrder(orderId);
  if(!o) return;
  const shotUrl = await DB.getScreenshotSignedUrl(o.screenshot_path);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'reqModalOverlay';
  const canDecide = o.payment_status === 'PENDING';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Payment Request — ${esc(o.order_id)}</h3>
      <div class="row"><span class="k">Customer</span><span class="v">${esc(o.name)}</span></div>
      <div class="row"><span class="k">Mobile</span><span class="v">${esc(o.mobile)}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">${esc(o.email||'—')}</span></div>
      <div class="row"><span class="k">Plan</span><span class="v">${esc(o.plan_name)}</span></div>
      <div class="row"><span class="k">Amount</span><span class="v">${inr(o.amount)}</span></div>
      <div class="row"><span class="k">UTR</span><span class="v">${esc(o.utr)}</span></div>
      <div class="row"><span class="k">Payment Date</span><span class="v">${fmtDate(o.payment_date)}</span></div>
      <div class="row"><span class="k">Submitted</span><span class="v">${fmtDateTime(o.created_at)}</span></div>
      <div class="row"><span class="k">Status</span><span class="v">${statusBadge(o)}</span></div>
      ${shotUrl ? `<img class="ss" src="${shotUrl}" alt="Payment screenshot" />` : '<p class="dim" style="font-size:13px;">No screenshot on file.</p>'}
      ${canDecide ? `
        <div id="confirmArea"></div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-block" onclick="closeModal()">Close</button>
          <button class="btn btn-danger btn-block" onclick="askReject('${esc(o.order_id)}')">Reject</button>
          <button class="btn btn-gold btn-block" onclick="askApprove('${esc(o.order_id)}')">Approve</button>
        </div>` : `<div class="modal-actions"><button class="btn btn-outline btn-block" onclick="closeModal()">Close</button></div>`}
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
}
function closeModal(){ const m = document.getElementById('reqModalOverlay'); if(m) m.remove(); }
function askApprove(orderId){
  const area = document.getElementById('confirmArea'); if(!area) return;
  area.innerHTML = `
    <div class="disclaimer-box" style="margin-top:16px;">
      <strong>Confirm payment approval?</strong><br>This will activate the customer's membership.
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" onclick="document.getElementById('confirmArea').innerHTML=''">Cancel</button>
        <button class="btn btn-gold btn-block" onclick="doApprove('${orderId}')">Approve Membership</button>
      </div>
    </div>`;
}
function askReject(orderId){
  const area = document.getElementById('confirmArea'); if(!area) return;
  area.innerHTML = `
    <div class="disclaimer-box" style="margin-top:16px;">
      <strong>Reject this payment?</strong>
      <div class="field" style="margin-top:12px;text-align:left;">
        <label>Internal reason (optional)</label>
        <input type="text" id="rejectReasonInput" placeholder="e.g. UTR does not match received payment" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" onclick="document.getElementById('confirmArea').innerHTML=''">Cancel</button>
        <button class="btn btn-danger btn-block" onclick="doReject('${orderId}')">Confirm Reject</button>
      </div>
    </div>`;
}
async function doApprove(orderId){
  const o = await DB.getOrder(orderId);
  if(!o || o.payment_status !== 'PENDING'){ toast('This request has already been decided.'); closeModal(); return; }
  const startDate = nowISO();
  const expiryDate = addMonthsClamped(startDate, o.duration_months);
  await DB.updateOrder(orderId, {
    payment_status:'APPROVED', membership_status:'ACTIVE',
    start_date: startDate, expiry_date: expiryDate,
    approved_at: nowISO(), approved_by: ADMIN_EMAIL || 'Admin',
    whatsapp_access_status: 'GRANTED',
  });
  await DB.addAudit('APPROVE_PAYMENT', orderId, `${o.name} · ${o.plan_name} · ${inr(o.amount)}`);
  closeModal();
  toast('Membership activated — opening WhatsApp to notify the customer.');
  const settings = await DB.getSettings();
  const msg = `Hi ${o.name}, your Charts Library Premium membership (${o.plan_name}) is now active! Join our Premium WhatsApp Channel here: ${settings.whatsapp_channel_link}`;
  const waUrl = 'https://wa.me/91' + o.mobile + '?text=' + encodeURIComponent(msg);
  window.open(waUrl, '_blank');
  render();
}
async function doReject(orderId){
  const o = await DB.getOrder(orderId);
  if(!o || o.payment_status !== 'PENDING'){ toast('This request has already been decided.'); closeModal(); return; }
  const reasonEl = document.getElementById('rejectReasonInput');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  await DB.updateOrder(orderId, { payment_status:'REJECTED', membership_status:'REJECTED', rejection_reason: reason || 'Payment could not be verified.' });
  await DB.addAudit('REJECT_PAYMENT', orderId, reason || '(no reason given)');
  closeModal(); toast('Payment marked as rejected.'); render();
}

let __memberFilter = 'ALL';
let __memberSearch = '';
async function renderAdminMembers(){
  if(!(await requireAdmin())) return;
  let orders = (await DB.listOrders()).map(deriveMembershipView);
  if(__memberSearch){
    const q = __memberSearch.toLowerCase();
    orders = orders.filter(o => (o.name||'').toLowerCase().includes(q) || (o.mobile||'').includes(q) || (o.order_id||'').toLowerCase().includes(q));
  }
  if(__memberFilter !== 'ALL'){
    orders = orders.filter(o=>{
      if(__memberFilter==='ACTIVE') return o.membership_status==='ACTIVE';
      if(__memberFilter==='EXPIRED') return o.membership_status==='EXPIRED';
      if(__memberFilter==='PENDING') return o.payment_status==='PENDING';
      if(__memberFilter==='REJECTED') return o.payment_status==='REJECTED';
      if(__memberFilter==='CANCELLED') return o.membership_status==='CANCELLED';
      return true;
    });
  }
  const body = `
    <div class="admin-topbar">
      <h1>Members</h1>
      <input class="search-input" placeholder="Search name, mobile, order ID" value="${esc(__memberSearch)}" oninput="onMemberSearch(this.value)" />
    </div>
    <div class="chip-filters" style="margin-bottom:20px;">
      ${['ALL','ACTIVE','PENDING','EXPIRED','REJECTED','CANCELLED'].map(f=>`<span class="chip ${__memberFilter===f?'active':''}" onclick="setMemberFilter('${f}')">${f[0]+f.slice(1).toLowerCase()}</span>`).join('')}
    </div>
    <div class="panel">
      <div class="tbl-wrap"><table class="admtbl">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Mobile</th><th>Plan</th><th>Amount</th><th>Expiry</th><th>Status</th><th>WhatsApp</th><th></th></tr></thead>
        <tbody>
          ${orders.length ? orders.map(o=>`
            <tr><td>${esc(o.order_id)}</td><td>${esc(o.name)}</td><td>${esc(o.mobile)}</td><td>${esc(o.plan_name)}</td><td>${inr(o.amount)}</td><td>${o.expiry_date ? fmtDate(o.expiry_date) : '—'}</td><td>${statusBadge(o)}</td><td>${o.whatsapp_access_status==='GRANTED' ? '✓ Granted' : '—'}</td><td><span class="link-btn" onclick="openMemberModal('${o.order_id}')">Manage</span></td></tr>`).join('')
            : `<tr class="empty-row"><td colspan="9">No members match this view.</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
  document.getElementById('app').innerHTML = adminShell('members', body);
}
function onMemberSearch(v){ __memberSearch = v; renderAdminMembers(); }
function setMemberFilter(f){ __memberFilter = f; renderAdminMembers(); }

async function saveExpiryChange(orderId){
  const val = document.getElementById('newExpiryInput').value;
  if(!val) return;
  const iso = new Date(val+'T00:00:00').toISOString();
  await DB.updateOrder(orderId, {expiry_date: iso, membership_status: daysUntil(iso)>=0 ? 'ACTIVE' : 'EXPIRED'});
  await DB.addAudit('EXTEND_MEMBERSHIP', orderId, 'New expiry: '+fmtDate(iso));
  toast('Expiry date updated.'); closeModal(); renderAdminMembers();
}
async function saveNote(orderId){
  const val = document.getElementById('noteInput').value.trim();
  if(!val) return;
  const o = await DB.getOrder(orderId);
  const notes = (o.notes||[]).concat([fmtDateTime(nowISO())+' — '+val]);
  await DB.updateOrder(orderId, {notes});
  await DB.addAudit('ADD_NOTE', orderId, val);
  toast('Note added.'); closeModal(); openMemberModal(orderId);
}
async function cancelMembership(orderId){
  await DB.updateOrder(orderId, {membership_status:'CANCELLED'});
  await DB.addAudit('CANCEL_MEMBERSHIP', orderId, '');
  toast('Membership cancelled.'); closeModal(); renderAdminMembers();
}
async function resendAccess(orderId){
  await DB.addAudit('RESEND_ACCESS', orderId, '');
  toast('Access instructions marked as resent.');
}

/* =========================================================================
   MAIN RENDER DISPATCH
   ========================================================================= */
async function render(){
  const {name, params} = ROUTE;
  try{
    if(name==='home' || name==='') return renderHome();
    if(name==='plans') return renderPlansPage();
    if(name==='join') return renderJoin(params[0]);
    if(name==='payment') return renderPaymentPage(params[0]);
    if(name==='submit-payment') return renderSubmitPayment(params[0]);
    if(name==='submitted') return renderSubmitted(params[0]);
    if(name==='support') return renderSupport();
    if(name==='legal') return renderLegal(params[0]);
    if(name==='admin'){
      const sub = params[0];
      if(!sub) return renderAdminGate();
      if(sub==='dashboard') return renderAdminDashboard();
      if(sub==='requests') return renderAdminRequests();
      if(sub==='members') return renderAdminMembers();
      if(sub==='expiring') return renderAdminExpiring();
      if(sub==='plans') return renderAdminPlans();
      if(sub==='settings') return renderAdminSettings();
      if(sub==='audit') return renderAdminAudit();
      return renderAdminGate();
    }
    return renderHome();
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `${topNav()}<div class="formpage"><div class="wrap"><div class="status-page"><h1>Something went wrong</h1><p class="sub">Please try again.</p><span class="btn btn-outline" onclick="go('')">Back to home</span></div></div></div>`;
  }
}

/* ---------------- init ---------------- */
(function init(){
  ROUTE = parseHash();
  render();
})();
